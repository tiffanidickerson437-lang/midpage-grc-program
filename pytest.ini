# pytest ignores dot-directories during collection, so `.github` has to be named
# explicitly. Without this line the pinning checker's own suite would be skipped
# silently and CI would stay green — a test suite that cannot run is worse than no
# test suite, because it looks like one.

[pytest]
testpaths =
    .github
    05-stakeholder-management/public-claims-consistency
norecursedirs = .git .venv venv __pycache__ node_modules
