# Every checker, attacked — on every push and every pull request.
#
# No path filter. A change anywhere in this repository runs the whole suite, because
# the observations and the validators are coupled: editing an observation file can
# invalidate a checker's assumptions, and editing a checker can silently start
# accepting a bad observation.
#
# NO STEP MAY SWALLOW A FAILURE. No `|| true`, no `continue-on-error`. A green check
# that cannot go red is decoration, and a compliance repository whose CI is decoration
# is worse than one with no CI at all — it manufactures unearned confidence.
#
# This is the check to gate `main` on in branch protection.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # SECURITY.md claims requirements.txt is hash-pinned. This proves it rather than
      # asserting it: --require-hashes fails the build if any digest is missing or
      # wrong, so the claim cannot quietly stop being true.
      - name: Install the runtime dependency, hash-verified
        run: pip install --require-hashes -r requirements.txt

      # Separately, and unpinned on purpose. pip applies hash checking to the entire
      # resolution once any requirement carries a hash, so the test dependency cannot
      # share an install with the hash-pinned one.
      - name: Install the test dependency
        run: pip install -r requirements-dev.txt

      # SECURITY.md also claims every action is pinned to a full commit SHA. Same
      # principle: a stated control with nothing enforcing it is the exact defect this
      # repository exists to point at.
      - name: Every action is pinned to a commit SHA
        run: python3 .github/check_action_pins.py --strict

      # The validators run FIRST. If an observation file is invalid, the tests that
      # assert "the committed data is valid" would fail anyway — but this ordering puts
      # the actual reason in the log instead of burying it in a test name.
      - name: Validate the retention observations
        run: python3 05-stakeholder-management/public-claims-consistency/check_retention.py --check

      - name: Validate the subprocessor observations
        run: python3 05-stakeholder-management/public-claims-consistency/subprocessor_consistency.py --check

      - name: Validate the metric observations
        run: python3 05-stakeholder-management/public-claims-consistency/check_metrics.py --check

      # From the repository root, so the pinning checker's own suite runs too. A
      # checker without a mutation guard is a finding under this repository's own
      # security policy, and that applies to the ones in .github as much as the rest.
      - name: Attack every checker
        run: python3 -m pytest -q

      # Every rendered report must be reproducible from its source. If a rendered
      # report differs from what is committed, the committed one is stale and the
      # repository is asserting findings it can no longer produce.
      - name: Rendered reports are not stale
        run: |
          cd 05-stakeholder-management/public-claims-consistency
          python3 check_retention.py --render
          python3 subprocessor_consistency.py --render
          python3 check_metrics.py --render
          cd - > /dev/null
          if ! git diff --exit-code -- 05-stakeholder-management/public-claims-consistency/*.md; then
            echo "::error::A rendered report is stale. Re-run the tools and commit the output."
            exit 1
          fi
